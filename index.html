<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الحب - World of Love</title>
    <style>
        body { background-color: #050505; background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px), radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px), radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px); background-size: 550px 550px, 350px 350px, 250px 250px; background-position: 0 0, 40px 60px, 130px 270px; color: #ffffff; font-family: sans-serif; margin: 0; padding: 0; text-align: center; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
        .ticker-container { width: 100%; background-color: #000000; border-bottom: 2px solid #ffd700; overflow: hidden; padding: 12px 0; }
        .ticker-wrapper { display: inline-block; white-space: nowrap; animation: marquee-live 20s linear infinite; }
        .ticker-link { text-decoration: none; color: inherit; font-weight: bold; font-size: 13px; padding: 0 20px; }
        .price { color: #ffd700; margin: 0 4px; }
        .up { color: #00ff66; } .down { color: #ff3333; }
        @keyframes marquee-live { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-50%, 0, 0); } }
        .container { max-width: 500px; width: 90%; margin: 20px auto; }
        .live-meta { background: #111; border: 1px solid #ffd700; border-radius: 12px; padding: 12px; margin-bottom: 20px; font-size: 13px; color: #e0e0e0; line-height: 1.6; }
        .lang-btn { background: #000; border: 1px solid #ffd700; color: #ffd700; padding: 5px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 0 3px; }
        .lang-btn.active { background: #ffd700; color: #000; }
        .section-box { background: #111; border: 1px solid #333; border-radius: 12px; padding: 20px 15px; margin: 20px auto; text-align: right; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .box-title { color: #ffd700; font-size: 16px; font-weight: bold; margin-bottom: 12px; border-bottom: 1px solid #ffd700; padding-bottom: 5px; display: flex; align-items: center; gap: 5px; }
        input[type="text"], select { width: 100%; padding: 12px; background: #000; border: 1px solid #ffd700; border-radius: 6px; color: #fff; box-sizing: border-box; margin-bottom: 12px; text-align: right; font-size: 14px; }
        .preview-box { background: rgba(0,0,0,0.4); border: 1px dashed #ffd700; border-radius: 6px; padding: 12px; color: #ffd700; font-size: 14px; text-align: center; margin-bottom: 12px; line-height: 1.5; font-style: italic; }
        .btn-gold-link { display: block; background: linear-gradient(45deg, #ffd700, #b8860b); border: none; color: #000; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; text-decoration: none; cursor: pointer; text-align: center; box-sizing: border-box; line-height: 1.4; }
        .btn-whatsapp-btn { display: block; width: 100%; background: linear-gradient(45deg, #25D366, #128C7E); border: none; color: #fff; padding: 14px; font-size: 15px; font-weight: bold; border-radius: 8px; text-decoration: none; cursor: pointer; text-align: center; box-sizing: border-box; margin-top: 5px; }
        .shop-box-desc { color: #e0e0e0; font-size: 13.5px; margin: 0 0 15px 0; line-height: 1.6; text-align: right; }
        .text-red { color: #ff3333; font-weight: bold; }
        .text-white { color: #ffffff; font-weight: bold; }
        .round-gold-btn { display: block; background: #050505; border: 2px solid #ffd700; color: #ffd700; padding: 13px; font-size: 14px; font-weight: bold; border-radius: 25px; text-decoration: none; text-align: center; margin: 15px auto 5px auto; width: 90%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        .round-pink-btn { display: block; background: #050505; border: 2px solid #ff3366; color: #ff3366; padding: 13px; font-size: 14px; font-weight: bold; border-radius: 25px; text-decoration: none; text-align: center; margin: 10px auto 5px auto; width: 90%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        .pubg-btn-static { display: block; background: #050505; border: 1px solid #ffffff; color: #ffffff; padding: 10px; font-size: 13px; font-weight: bold; border-radius: 5px; text-decoration: none; text-align: center; margin: 10px auto; width: 90%; box-sizing: border-box; }
        .sub-title-en { font-size: 20px; font-weight: bold; color: #ffd700; margin: -2px 0 15px 0; font-style: italic; font-family: 'Georgia', serif; letter-spacing: 1px; }
        .tasbih-display { font-size: 42px; font-weight: bold; color: #ffd700; text-align: center; margin: 10px 0; font-family: monospace; letter-spacing: 2px; text-shadow: 0 0 15px rgba(255,215,0,0.4); }
        .tasbih-btn { display: block; width: 140px; height: 140px; background: linear-gradient(45deg, #ffd700, #b8860b); color: #000; font-size: 22px; font-weight: bold; border-radius: 50%; border: 4px solid #000; box-shadow: 0 5px 20px rgba(255,215,0,0.4); cursor: pointer; margin: 15px auto; display: flex; align-items: center; justify-content: center; transition: transform 0.1s ease; }
        .tasbih-btn:active { transform: scale(0.92); }
        .tasbih-reset { display: inline-block; background: #222; border: 1px dashed #ffd700; color: #ffd700; padding: 6px 15px; font-size: 12px; font-weight: bold; border-radius: 20px; cursor: pointer; text-decoration: none; margin-top: 5px; }
        .secret-output { background: rgba(0,0,0,0.6); border: 2px dashed #ffd700; border-radius: 8px; padding: 15px; color: #ffd700; font-size: 15px; font-weight: bold; text-align: center; margin-top: 15px; line-height: 1.6; min-height: 25px; display: none; }
        .secret-btn { display: block; width: 100%; background: linear-gradient(45deg, #ffd700, #b8860b); color: #000; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; box-shadow: 0 4px 10px rgba(255,215,0,0.2); }
        .audio-player-box { background: #1a1a1a; border: 1px solid #ffd700; border-radius: 8px; padding: 10px; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .audio-ctrl-btn { background: #000; border: 1px solid #ffd700; color: #ffd700; padding: 8px 16px; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .audio-ctrl-btn:active { transform: scale(0.95); }
        .family-logo-wrapper { margin-top: 30px; margin-bottom: 15px; display: inline-block; transform: rotate(-8deg); animation: logo-pulsing 1.2s ease-in-out infinite; }
        .family-logo { font-size: 36px; font-weight: bold; color: #ffd700; letter-spacing: 3px; font-family: 'Georgia', serif; padding: 4px 22px; border-top: 3px double #ffd700; border-bottom: 3px double #ffd700; text-shadow: 0 0 10px #ffd700; }
        @keyframes logo-pulsing { 0% { transform: rotate(-8deg) scale(1); } 50% { transform: rotate(-8deg) scale(1.06); filter: drop-shadow(0 0 15px #ffd700); } 100% { transform: rotate(-8deg) scale(1); } }
        .pulse-fast { animation: fast-pulsing 1.2s ease-in-out infinite; }
        @keyframes fast-pulsing { 0% { transform: scale(1); text-shadow: 0 0 5px #ffd700; } 50% { transform: scale(1.04); text-shadow: 0 0 20px #ffd700, 0 0 30px #b8860b; } 100% { transform: scale(1); text-shadow: 0 0 5px #ffd700; } }
        .visitor-counter { color: #ffd700; font-size: 13px; font-weight: bold; margin-top: 20px; background: #000; padding: 8px 15px; border-radius: 20px; border: 1px dashed #ffd700; display: inline-block; }
    </style>
    <script>
        var currentLang = 'ar';
        var audioObj = new Audio("https://mp3quran.net");
        document.addEventListener('contextmenu', event => event.preventDefault());
        function playLiveAudio() { audioObj.play(); }
        function pauseLiveAudio() { audioObj.pause(); }
        function unlockSecret() {
            var code = document.getElementById("secret-input").value.trim();
            var outBox = document.getElementById("secret-box-output");
            outBox.style.display = "block";
            if (code === "123") {
                outBox.style.borderColor = "#00ff66";
                outBox.innerHTML = "✨ مفاجأة سرية مذهلة لكم الحين:<br><span style='color:#fff;'>\" أنت نبض هذا القلب وأجمل أمنية في هذا العالم بالكامل! 💖 \"</span>";
            } else if (code.toUpperCase() === "KR") {
                outBox.style.borderColor = "#ffd700";
                outBox.innerHTML = "👑 بصمة العائلة الملكية المخلصة ترحب بك كلياً الحين:<br><span style='color:#fff;'>\" أهلاً بك في عالم السرية، المصداقية الكبرى، والحب الأبدي الذي لا ينتهي! 👑 \"</span>";
            } else if (code === "") {
                outBox.style.borderColor = "#ff3333";
                outBox.innerHTML = "⚠️ يرجى كتابة الكلمة السرية داخل الحقل أولاً لفتح القفل كلياً!";
            } else {
                outBox.style.borderColor = "#ff3333";
                outBox.innerHTML = "❌ عذراً الكلمة السرية خاطئة ومجهولة.. حاول مجدداً بقفل الأمان الصارم للمنصة!";
            }
        }
        function countTasbih() {
            var count = localStorage.getItem('tasbih_count') || 0;
            count = parseInt(count) + 1; localStorage.setItem('tasbih_count', count);
            document.getElementById("tasbih-val").innerText = count.toLocaleString();
            if (navigator.vibrate) { navigator.vibrate(30); }
        }
        function resetTasbih() {
            localStorage.setItem('tasbih_count', 0); document.getElementById("tasbih-val").innerText = "0";
        }

            var now = new Date();
