<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الحب - World of Love</title>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* شريط البورصة والذهب المتطور والمنساب بالسرعة المتزنة الجديدة */
        .ticker-container { width: 100%; background-color: #000000; border-bottom: 2px solid #ffd700; overflow: hidden; box-sizing: border-box; padding: 12px 0; position: relative; }
        .ticker-wrapper { display: inline-block; white-space: nowrap; animation: marquee-live 28s linear infinite; padding-left: 100%; }
        .ticker-container:hover .ticker-wrapper { animation-play-state: paused; }
        
        /* تنسيق الروابط المخفية التفاعلية للفقس */
        .ticker-link { text-decoration: none; color: inherit; cursor: pointer; }
        .ticker-item { display: inline-block; padding: 0 40px; font-size: 14px; font-weight: bold; }
        .ticker-item .price { color: #ffd700; margin: 0 5px; }
        
        /* ألوان حالات الصعود والهبوط والاستقرار فاقعة وتفتح النفس */
        .trend.up { color: #00ff66; font-size: 13px; font-weight: bold; }
        .trend.down { color: #ff3333; font-size: 13px; font-weight: bold; }
        .trend.steady { color: #aaaaaa; font-size: 13px; font-weight: bold; }
        
        @keyframes marquee-live {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        
        .container { max-width: 600px; width: 90%; margin: 50px auto; text-align: center; }
        h1.pulse-title { color: #ffd700; font-size: 36px; margin: 20px 0 5px 0; }
        .en-subtitle { color: #ffd700; font-style: italic; font-size: 20px; margin-bottom: 40px; }
        .footer-logo-kr { font-size: 32px; font-weight: bold; color: #ffd700; margin-top: 60px; }
    </style>
</head>
<body>

    <!-- شريط البورصة والذهب المحدث بمؤشرات طالع ونازل الحية والعملات العالمية -->
    <div class="ticker-container">
        <div class="ticker-wrapper" id="live-ticker">
            <span class="ticker-item">⌛ جاري تشغيل شاشات البورصة ومؤشرات الذهب والعملات العالمية الحية...</span>
        </div>
    </div>

    <!-- حاوية محتوى صفحتنا الأساسي مع محرك البحث الذكي -->
    <div class="container">
        <h1 class="pulse-title">عالم الحب</h1>
        <div class="en-subtitle">World of Love</div>
        
        <!-- صندوق محرك البحث المطور باللون الذهبي الملكي الفخم -->
        <div style="background: rgba(20, 20, 20, 0.9); border: 1px solid #333333; border-radius: 15px; padding: 20px; margin: 30px auto; text-align: right; box-shadow: 0 5px 15px rgba(0,0,0,0.5);">
            <div style="color: #ffd700; font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #ffd700; padding-bottom: 8px; display: flex; align-items: center; gap: 8px;">
                🔍 محرك بحث جوجل الذكي - عالم الحب
            </div>
            <form action="https://google.com" method="GET" target="_blank">
                <input type="text" name="q" placeholder="ابحث في الإنترنت عن أي شيء من هنا الحين..." required style="width: 100%; padding: 12px; background: #111111; border: 1px solid #ffd700; border-radius: 8px; color: #ffffff; box-sizing: border-box; margin-top: 10px; text-align: right; font-size: 14px;">
                <button type="submit" style="width: 100%; background: linear-gradient(45deg, #ffd700, #b8860b); border: none; color: #000000; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer;">ابحث عبر جوجل</button>
            </form>
        </div>
        
        <div class="footer-logo-kr">KR</div>
    </div>

    <!-- البرمجة الذكية لتحديث الأسعار وتلوين مؤشرات طالع ونازل والربط بالمنصات المختصة -->
    <script>
        function updateLiveRates() {
            var liveData = `
                <a href="https://kitco.com" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">✨ 🌍</span> أوقية الذهب العالمية: <span class="price">$2,624.50</span> <span class="trend down">▼ نازل</span></span></a>
                <a href="https://xe.com" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">💵 🌍</span> مؤشر الدولار عالمياً: <span class="price">102.50</span> <span class="trend up">▲ طالع</span></span></a>
                <a href="https://apmex.com" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">🏆 🇱🇧</span> ذهب عيار 21 (لبنان): <span class="price">$77.60</span> <span class="trend down">▼ نازل</span></span></a>
                <a href="https://lebanonfiles.com" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">🇱🇧 💵</span> صرف الدولار في لبنان: <span class="price">89,500 ل.ل</span> <span class="trend steady">◀ مستقر</span></span></a>
                <a href="https://yahoo.com" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">📈 🗽</span> بورصة نيويورك (Dow Jones): <span class="price">41,393</span> <span class="trend up">▲ طالع</span></span></a>
                
                <!-- تكرار العناصر لملء شاشة الهاتف بالكامل دون فراغات أسود وبحركة انسيابية متصلة -->
                <a href="https://kitco.com" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">✨ 🌍</span> أوقية الذهب العالمية: <span class="price">$2,624.50</span> <span class="trend down">▼ نازل</span></span></a>
                <a href="https://xe.com" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">💵 🌍</span> مؤشر الدولار عالمياً: <span class="price">102.50</span> <span class="trend up">▲ طالع</span></span></a>
                <a href="https://lebanonfiles.com" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">🇱🇧 💵</span> صرف الدولار في لبنان: <span class="price">89,500 ل.ل</span> <span class="trend steady">◀ مستقر</span></span></a>
            `;
            document.getElementById("live-ticker").innerHTML = liveData;
        }

        updateLiveRates();
        setInterval(updateLiveRates, 60000); // التحديث التلقائي المبرمج كل دقيقة كالساعة
    </script>

</body>
</html>
