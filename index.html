<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الحب - World of Love</title>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* شريط البورصة العالمي المتطور - حركة دائرية متصلة ومزدحمة تمنع الفراغ الأسود كلياً */
        .ticker-container { width: 100%; background-color: #000000; border-bottom: 2px solid #ffd700; overflow: hidden; box-sizing: border-box; padding: 12px 0; position: relative; }
        .ticker-wrapper { display: inline-block; white-space: nowrap; animation: marquee-live 25s linear infinite; }
        .ticker-container:hover .ticker-wrapper { animation-play-state: paused; }
        .ticker-link { text-decoration: none; color: inherit; cursor: pointer; }
        .ticker-item { display: inline-block; padding: 0 40px; font-size: 14px; font-weight: bold; }
        .ticker-item .price { color: #ffd700; margin: 0 5px; }
        .trend.up { color: #00ff66; font-size: 13px; font-weight: bold; }
        .trend.down { color: #ff3333; font-size: 13px; font-weight: bold; }
        .trend.steady { color: #aaaaaa; font-size: 13px; font-weight: bold; }
        
        /* ضبط نقطة التكرار هندسياً عند منتصف المحتوى تماماً لإلغاء أي سواد وفراغات */
        @keyframes marquee-live { 
            0% { transform: translate3d(0, 0, 0); } 
            100% { transform: translate3d(-50%, 0, 0); } 
        }
        
        .container { max-width: 600px; width: 90%; margin: 30px auto; text-align: center; }
        .live-meta { background: rgba(25, 25, 25, 0.9); border: 1px solid #ffd700; border-radius: 15px; padding: 15px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(255, 215, 0, 0.1); font-size: 14px; color: #e0e0e0; line-height: 1.8; }
        .lang-btn { background: #111; border: 1px solid #ffd700; color: #ffd700; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 0 5px; }
        .lang-btn.active { background: #ffd700; color: #000; }
        
        h1.pulse-title { color: #ffd700; font-size: 36px; margin: 20px 0 5px 0; }
        .en-subtitle { color: #ffd700; font-style: italic; font-size: 20px; margin-bottom: 30px; }
        
        .section-box { background: rgba(20, 20, 20, 0.9); border: 1px solid #333333; border-radius: 15px; padding: 20px; margin: 25px auto; text-align: right; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .box-title { color: #ffd700; font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #ffd700; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        input[type="text"] { width: 100%; padding: 12px; background: #111111; border: 1px solid #ffd700; border-radius: 8px; color: #ffffff; box-sizing: border-box; margin-top: 10px; text-align: right; font-size: 14px; }
        button.btn-gold { width: 100%; background: linear-gradient(45deg, #ffd700, #b8860b); border: none; color: #000000; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; margin-top: 15px; cursor: pointer; }
        
        .visitor-counter { color: #ffd700; font-size: 15px; font-weight: bold; margin-top: 40px; background: #000; padding: 10px 20px; border-radius: 20px; border: 1px dashed #ffd700; display: inline-block; }
        .footer-logo-kr { font-size: 32px; font-weight: bold; color: #ffd700; margin-top: 30px; }
    </style>

    <!-- الأكواد البرمجية بالرأس لتفعيل تشغيل ساعة الثواني والبورصة فوراً للموبايل دون حظر -->
    <script>
        var currentLang = 'ar';

        function updateClockAndWeather() {
            var now = new Date();
            var timeString = now.toLocaleTimeString(currentLang === 'ar' ? 'ar-LB' : 'en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
            
            if (currentLang === 'ar') {
                var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                var dateString = now.toLocaleDateString('ar-LB', options);
                document.getElementById("live-clock-weather").innerHTML = `📅 ${dateString} | ⏰ الساعة: ${timeString} <br> ☀️ بيروت: C°24 | 💧 الرطوبة: 62%`;
            } else {
                var optionsEn = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                var dateStringEn = now.toLocaleDateString('en-US', optionsEn);
                document.getElementById("live-clock-weather").innerHTML = `📅 ${dateStringEn} | ⏰ Time: ${timeString} <br> ☀️ Beirut: 24°C | 💧 Humidity: 62%`;
            }
        }

        function translateText() {
            var text = document.getElementById("trans-text").value;
            if(text.trim() !== "") {
                window.open("https://google.com" + encodeURIComponent(text) + "&op=translate", '_blank');
            } else { 
                alert(currentLang === 'ar' ? "الرجاء كتابة نص أولاً لترجمته!" : "Please type text first to translate!"); 
            }
        }

        function switchLang(lang) {
            currentLang = lang;
            document.getElementById("btn-ar").classList.toggle("active", lang === 'ar');
            document.getElementById("btn-en").classList.toggle("active", lang === 'en');
            
            if (lang === 'en') {
                document.getElementById("main-title").innerText = "World of Love";
                document.getElementById("title-search").innerText = "🔍 Google Smart Search - World of Love";
                document.getElementById("input-search").placeholder = "Type what you want to search (e.g., New Elissa song)...";
                document.getElementById("btn-search").innerText = "Search via Google & Show Results Immediately";
                document.getElementById("title-trans").innerText = "🌐 Instant Translation (Arabic ➔ English)";
                document.getElementById("trans-text").placeholder = "Type Arabic text here to translate instantly...";
                document.getElementById("btn-trans").innerText = "Translate Text & Show Results Immediately";
                document.getElementById("visitor-box").innerHTML = "👥 Our Live Visitors: <span style='color:#fff;' id='counter-val'>1,254</span> Visitors";
            } else {
                document.getElementById("main-title").innerText = "عالم الحب";
                document.getElementById("title-search").innerText = "🔍 محرك بحث جوجل الذكي - عالم الحب";
                document.getElementById("input-search").placeholder = "اكتب ما تريد البحث عنه (مثال: أغنية إليسا الجديدة)...";
                document.getElementById("btn-search").innerText = "ابحث عبر جوجل واعرض النتائج فوراً";
                document.getElementById("title-trans").innerText = "🌐 الترجمة الفورية السريعة (عربي ➔ English)";
                document.getElementById("trans-text").placeholder = "اكتب الكلمة أو الجملة العربية هنا للترجمة فوراً...";
                document.getElementById("btn-trans").innerText = "ترجم النص واعرض النتيجة فوراً";
                document.getElementById("visitor-box").innerHTML = "👥 عدد زوار صفحتنا الحين: <span style='color:#fff;' id='counter-val'>1,254</span> زائر";
            }
            updateClockAndWeather();
            var count = localStorage.getItem('page_view') || 1254;
            document.getElementById("counter-val").innerText = count;
        }

        // تشغيل برمجيات العداد والساعة فور فتح الواجهة مباشرة
        window.onload = function() {
            setInterval(updateClockAndWeather, 1000);
            updateClockAndWeather();

            var count = localStorage.getItem('page_view');
            if (count === null) { count = 1254; } else { count = parseInt(count) + 1; }
            localStorage.setItem('page_view', count);
            document.getElementById("counter-val").innerText = count;
        };
    </script>
</head>
