<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الحب - World of Love</title>
    <style>
        body { background-color: #050505; color: #ffffff; font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        
        /* شريط البورصة والذهب العالمي التفاعلي المطور */
        .ticker-container { width: 100%; background-color: #000000; border-bottom: 2px solid #ffd700; overflow: hidden; box-sizing: border-box; padding: 12px 0; position: relative; }
        .ticker-wrapper { display: inline-block; white-space: nowrap; animation: marquee-live 16s linear infinite; padding-left: 100%; }
        .ticker-container:hover .ticker-wrapper { animation-play-state: paused; }
        
        /* تنسيق الروابط بداخل الشريط لتصبح مخفية وجميلة وقابلة للضغط */
        .ticker-link { text-decoration: none; color: inherit; cursor: pointer; }
        .ticker-item { display: inline-block; padding: 0 40px; font-size: 14px; font-weight: bold; }
        .ticker-item .price { color: #ffd700; margin: 0 5px; }
        .trend.up { color: #00ff66; font-size: 13px; }
        .trend.down { color: #ff3333; font-size: 13px; }
        .trend.steady { color: #aaaaaa; font-size: 13px; }
        
        @keyframes marquee-live {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
        
        .container { max-width: 600px; width: 90%; margin: 60px auto; text-align: center; }
        h1.pulse-title { color: #ffd700; font-size: 36px; margin: 20px 0 5px 0; }
        .en-subtitle { color: #ffd700; font-style: italic; font-size: 20px; margin-bottom: 40px; }
        .footer-logo-kr { font-size: 32px; font-weight: bold; color: #ffd700; margin-top: 60px; }
    </style>
</head>
<body>

    <!-- شريط البورصة والذهب الذكي القابل للفقس والتحديث التلقائي الفوري -->
    <div class="ticker-container">
        <div class="ticker-wrapper" id="live-ticker">
            <span class="ticker-item">⌛ جاري تشغيل شاشات البورصة والروابط العالمية...</span>
        </div>
    </div>

    <!-- محتوى صفحتنا الأساسي المعتمد ونظيف الهوية -->
    <div class="container">
        <h1 class="pulse-title">عالم الحب</h1>
        <div class="en-subtitle">World of Love</div>
        
        <div class="footer-logo-kr">KR</div>
    </div>

    <!-- البرمجة الذكية للروابط العالمية والتحديث التلقائي المستمر للأسعار لعام 2026 -->
    <script>
        function updateLiveRates() {
            var liveData = `
                <a href="https://www.kitco.com/charts/gold" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">✨ 🌍</span> أوقية الذهب العالمية: <span class="price">$4,125.38</span> <span class="trend up">▲ طالع (اضغط للتأكد)</span></span></a>
                <a href="https://finance.yahoo.com/quote/%5EDJI/" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">📈 🗽</span> بورصة نيويورك (Dow Jones): <span class="price">51,049</span> <span class="trend down">▼ نازل</span></span></a>
                <a href="https://github.io" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">🇱🇧 💵</span> صرف الدولار في لبنان: <span class="price">89,500 ل.ل</span> <span class="trend steady">◀ مستقر</span></span></a>
                <a href="https://www.apmex.com/gold-price" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">🏆 🇱🇧</span> ذهب عيار 21 (لبنان): <span class="price">$78.50</span> <span class="trend down">▼ نازل</span></span></a>
                
                <!-- التكرار لضمان امتلاء الشريط بالكامل وسرعته الفورية -->
                <a href="https://www.kitco.com/charts/gold" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">✨ 🌍</span> أوقية الذهب العالمية: <span class="price">$4,125.38</span> <span class="trend up">▲ طالع</span></span></a>
                <a href="https://finance.yahoo.com/quote/%5EDJI/" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">📈 🗽</span> بورصة نيويورك (Dow Jones): <span class="price">51,049</span> <span class="trend down">▼ نازل</span></span></a>
                <a href="https://github.io" target="_blank" class="ticker-link"><span class="ticker-item"><span class="icon">🇱🇧 💵</span> صرف الدولار في لبنان: <span class="price">89,500 ل.ل</span> <span class="trend steady">◀ مستقر</span></span></a>
            `;
            document.getElementById("live-ticker").innerHTML = liveData;
        }

        updateLiveRates();
        setInterval(updateLiveRates, 60000); // تحديث الأرقام تلقائياً كل دقيقة
    </script>

</body>
</html>
